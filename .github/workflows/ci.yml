name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite starts its own MongoDB via mongodb-memory-server, so no
      # service containers are needed.
      - name: Run tests
        run: npm test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only main publishes; every other branch still builds to prove the image
      # compiles, but never talks to the registry.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Same repository override the rollback workflow resolves tags from.
          images: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}', github.repository) }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.config.outputs.enabled }}

    steps:
      # The deploy job is optional: without DEPLOY_HOST it reports and skips, so
      # a repository that only builds is never left with a red main.
      - name: Check deploy configuration
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice title=Deploy skipped::DEPLOY_HOST is not configured for this repository."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deploy key
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Pulls the image this run just published, applies migrations with it, then
      # switches the service over and waits for /health. The server keeps its own
      # .env; this job only supplies the image tag.
      - name: Roll out over SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH:?DEPLOY_PATH is not set}"
          echo "Deploying $IMAGE_TAG"

          docker compose pull api
          docker compose run --rm --no-deps api npm run migrate
          docker compose up -d --no-build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HEALTH_PORT:-5000}/health" >/dev/null; then
              echo "Health check passed after $attempt attempt(s)"
              docker image prune -f --filter 'until=168h' >/dev/null || true
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed — recent logs:"
          docker compose logs --tail=60 api || true
          exit 1
          REMOTE

  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    # Only after a deploy that actually ran, so an unconfigured repo stays green.
    if: github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    environment: production

    steps:
      - name: Check smoke configuration
        id: config
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "::notice title=Smoke test skipped::SMOKE_URL is not configured for this repository."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Health endpoint
        if: steps.config.outputs.enabled == 'true'
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -euo pipefail
          base="${SMOKE_URL%/}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          code=$(curl -sS --max-time 20 -o "$workdir/health.json" -w '%{http_code}' "$base/health" || true)
          if [ "$code" != "200" ]; then
            echo "::error::GET $base/health returned ${code:-no response}"
            cat "$workdir/health.json" 2>/dev/null || true
            exit 1
          fi
          HEALTH_FILE="$workdir/health.json" node -e '
            const raw = require("fs").readFileSync(process.env.HEALTH_FILE, "utf8");
            const health = JSON.parse(raw);
            if (health.success !== true || health.data?.status !== "ok") {
              console.error("unexpected health payload:", raw);
              process.exit(1);
            }
            console.log("health: ok, database", health.data.database);
          '

      - name: Quiz catalogue
        if: steps.config.outputs.enabled == 'true'
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -euo pipefail
          base="${SMOKE_URL%/}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          code=$(curl -sS --max-time 20 -o "$workdir/quizzes.json" -w '%{http_code}' "$base/api/quizzes?limit=3" || true)
          if [ "$code" != "200" ]; then
            echo "::error::GET $base/api/quizzes returned ${code:-no response}"
            cat "$workdir/quizzes.json" 2>/dev/null || true
            exit 1
          fi
          QUIZ_FILE="$workdir/quizzes.json" node -e '
            const raw = require("fs").readFileSync(process.env.QUIZ_FILE, "utf8");
            const catalogue = JSON.parse(raw);
            if (catalogue.success !== true || !Array.isArray(catalogue.data)) {
              console.error("unexpected catalogue payload:", raw.slice(0, 300));
              process.exit(1);
            }
            console.log(`catalogue: ${catalogue.data.length} quiz(zes) on the first page`);
          '

      # Uses a dedicated student account (SMOKE_EMAIL/SMOKE_PASSWORD) rather than
      # an admin, then signs out so the run leaves no live session behind.
      - name: Sign in and verify session
        if: steps.config.outputs.enabled == 'true'
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ]; then
            echo "::notice title=Sign-in check skipped::SMOKE_EMAIL/SMOKE_PASSWORD are not configured."
            exit 0
          fi

          base="${SMOKE_URL%/}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          jar="$workdir/cookies.txt"

          node -e 'process.stdout.write(JSON.stringify({ identifier: process.env.SMOKE_EMAIL, password: process.env.SMOKE_PASSWORD, expectedRole: "student" }))' > "$workdir/login-request.json"

          code=$(curl -sS --max-time 20 -c "$jar" -o "$workdir/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' --data @"$workdir/login-request.json" \
            "$base/api/auth/login" || true)
          if [ "$code" != "200" ]; then
            echo "::error::POST $base/api/auth/login returned ${code:-no response}"
            cat "$workdir/login.json" 2>/dev/null || true
            exit 1
          fi
          if ! grep -q 'qf_access' "$jar"; then
            echo "::error::Sign-in did not set a session cookie"
            exit 1
          fi

          code=$(curl -sS --max-time 20 -b "$jar" -o "$workdir/me.json" -w '%{http_code}' "$base/api/auth/me" || true)
          if [ "$code" != "200" ]; then
            echo "::error::GET $base/api/auth/me returned ${code:-no response} after sign-in"
            cat "$workdir/me.json" 2>/dev/null || true
            exit 1
          fi
          ME_FILE="$workdir/me.json" node -e '
            const raw = require("fs").readFileSync(process.env.ME_FILE, "utf8");
            const me = JSON.parse(raw);
            if (me.success !== true || !me.data?.email) {
              console.error("unexpected session payload:", raw.slice(0, 300));
              process.exit(1);
            }
            console.log(`session: signed in as ${me.data.email} (${me.data.role})`);
          '

          curl -sS --max-time 20 -b "$jar" -X POST "$base/api/auth/logout" -o /dev/null || true
          echo "sign-in: ok (session closed)"
