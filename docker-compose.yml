services:
  api:
    # Local `docker compose up --build` builds and tags this name; a server can
    # instead `docker compose pull api` a tag published by CI.
    image: ${IMAGE_REPO:-ghcr.io/althaeaparra/online-quiz-system}:${IMAGE_TAG:-latest}
    build: .
    container_name: citebraincheck-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: http://localhost:5000
      CORS_ORIGINS: http://localhost:5000
      MONGO_URI: mongodb://mongo:27017/citebraincheck
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      # Compose serves plain HTTP on localhost, so Secure cookies stay off.
      # Set COOKIE_SECURE=true (in .env) once TLS terminates in front of it.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-CITE BrainCheck <no-reply@citebraincheck.dev>}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
      - logs:/app/logs

  mongo:
    image: mongo:7
    container_name: citebraincheck-mongo
    restart: unless-stopped
    command: ['--wiredTigerCacheSizeGB', '0.5']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: citebraincheck-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  uploads:
  logs:
